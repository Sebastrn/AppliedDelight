# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# NeoForge — mirror the version verified against the full AE2 dev stack on 1.21.1 (see Applied Cooking).
# AE2 declares [21.1.169,) as a floor; 21.1.238 sits above known-bad 169 (TOP game-bus abort) and satisfies AE2.
neo_version=21.1.238
neo_version_range=[21.1,)
# FML loader version range (javafml)
loader_version_range=[1,)

## Publishing project ids (tokens go in GRADLE_USER_HOME/gradle.properties, NOT here). Filled once published.
curseforge_id=1621418
modrinth_id=GKLhL3bQ

## Mod Properties
mod_id=applieddelight
mod_name=Applied Delight
mod_license=MIT
mod_version=1.0.0
mod_group_id=sebastrn
mod_authors=ItsSebastrn
mod_description=Cook Farmer's Delight meals straight from your Applied Energistics 2 network.

## Dependency versions (NeoForge 1.21.1 builds)
# AE2 publishes to Maven Central at 1.21.1: group org.appliedenergistics, artifact appliedenergistics2 (no -neoforge
# suffix). It pulls GuideME (org.appliedenergistics:guideme) transitively.
ae2_version=19.2.17
# Farmer's Delight — Modrinth version id for the NeoForge 1.21.1 build (1.21.1-1.3.2). The Modrinth maven jar has no
# POM, but FD has no hard deps beyond NeoForge, so nothing is lost.
fd_version=GbNuOZ4S
# AEInfinityBooster — optional dev-runtime dep to test booster compatibility (Infinity/Dimension cards in the WAP).
# Not compiled against (compat is detected softly). Fill with the Modrinth version id to load it in the dev client.
aeinfinitybooster_version=qpbQk2Iq
# JEI (recipe viewer) + Jade (block tooltip HUD) — dev-runtime only, for testing. Not shipped, not compiled against.
jei_version=19.39.0.368
jade_version=yd8FKCmx
# REI + EMI: the other two recipe viewers. Each gets the same catalyst/workstation + info page as JEI.
# REI compiles against its full jar (BuiltinClientPlugin isn't in -api); EMI against its -api classifier.
rei_version=16.0.799
emi_version=1.1.24+1.21.1
# Patchouli — the in-game guide book. Data-driven, so runtime-only.
patchouli_version=1.21.1-93-NEOFORGE
# The One Probe — the other block-tooltip HUD alongside Jade.
top_version=1.21_neo-12.0.8-7
