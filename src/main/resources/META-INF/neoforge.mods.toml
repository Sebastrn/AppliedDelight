modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "logo.png"
description = '''${mod_description}'''

[[dependencies.applieddelight]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.applieddelight]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.applieddelight]]
modId = "ae2"
type = "required"
versionRange = "[19,)"
ordering = "AFTER"
side = "BOTH"

# Farmer's Delight supplies the cooking recipes we read and the heat-source tags our pot reacts to.
# NOTE: FD's declared mod version is "1.3.2" (not the Modrinth file name "1.21.1-1.3.2"), so the range must be 1.3.x.
[[dependencies.applieddelight]]
modId = "farmersdelight"
type = "required"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"

# Optional: if present, its Infinity/Dimension cards in the linked Wireless Access Point extend the ME Cooking Pot's
# range / allow cross-dimension access. Detected softly, never required.
[[dependencies.applieddelight]]
modId = "aeinfinitybooster"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
